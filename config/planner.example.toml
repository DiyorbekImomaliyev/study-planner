  "05:15-06:15 focus leetcode",
  "07:00-10:00 focus uni",
  "10:30-12:30 focus uni",
  "13:30-14:30 focus learn push",
  "18:00-19:30 break parents + dinner",
  "19:30-21:00 focus uni",
]
