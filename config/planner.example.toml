# Daily routine around the classes. One block per line: "HH:MM-HH:MM kind task".
# kind: focus or break. Focus tasks: leetcode, learn, uni, push (push rides on a learn block).
# The same anchors every day: leetcode 05:15, parents + dinner 18:00, sleep 22:00.
[routine]
sun = [
  "05:15-07:15 focus leetcode",
  "10:00-11:30 focus learn",
  "14:30-15:30 focus uni",
  "16:00-18:00 focus learn",
  "18:00-19:30 break parents + dinner",
  "19:30-21:30 focus learn push",
]
mon = [
  "05:15-07:15 focus leetcode",
  "07:45-09:15 focus learn",
  "12:30-13:30 focus uni",
  "16:30-18:00 focus learn",
  "18:00-19:30 break parents + dinner",
  "19:30-21:30 focus learn push",
]
tue = [
  "05:15-07:15 focus leetcode",
  "08:00-11:00 focus learn",
  "11:00-12:00 focus uni",
  "13:00-16:00 focus learn",
  "16:00-17:00 break exercise",
  "17:00-18:00 focus learn",
  "18:00-19:30 break parents + dinner",
  "19:30-21:00 focus learn push",
]
wed = [
  "05:15-07:15 focus leetcode",
  "07:45-09:15 focus learn",
  "13:30-14:30 focus uni",
  "15:00-18:00 focus learn",
  "18:00-19:30 break parents + dinner",
  "19:30-21:00 focus learn push",
]
thu = [
  "05:15-07:15 focus leetcode",
  "12:30-13:30 focus uni",
  "18:00-19:30 break parents + dinner",
  "19:30-21:30 focus learn push",
]
fri = [
  "05:15-07:15 focus leetcode",
  "08:00-11:00 focus learn",
  "11:00-12:00 focus uni",
  "12:00-14:00 break lunch + rest",
  "14:00-17:00 focus learn",
  "18:00-19:30 break parents + dinner",
  "19:30-21:00 focus learn push",
]
sat = [
  "05:15-07:15 focus leetcode",
  "08:00-11:00 focus learn",
  "11:00-12:00 focus uni",
  "13:00-16:00 focus learn",
  "18:00-19:30 break parents + dinner",
  "20:00-21:00 focus learn push",
]
# Every day in exam mode. Revision goes first; leetcode and push stay short.
# On an exam day the exam is added and blocks that overlap it are dropped.
