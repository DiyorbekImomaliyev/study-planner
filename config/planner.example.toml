# Study Planner settings. Copy to config/planner.toml and edit.
# Times are local (timezone below). Days: sun mon tue wed thu fri sat.

timezone = "Asia/Qatar"
send_at = "05:00"          # daily message
quiet_from = "22:00"       # no alerts from here ...
quiet_until = "05:00"      # ... until here
weekly_summary = "sat 20:00"
start_date = 2026-10-24    # day 1; progress counts from here
classes_end = 2026-12-03   # no classes after this date
exam_mode = [2026-12-03, 2026-12-12]

# Short names you can type in messages ("os midterm nov 5").
[aliases]
garc = "garc2002"
